---
layout: default
---
<style>
  /* 首页首图黑魔法 */
  .hero-section {
    width: 100vw;
    height: 65vh; 
    margin-left: calc(-50vw + 50%); 
    /* 👇 就是下面这一行，在这里把单引号里的链接换成你想要的图片网址 */
    background-image: url('https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=2000&q=80'); 
    background-size: cover;
    background-position: center;
    position: relative;
    top: -50px; 
  }

  /* "文章列表" 小标题 */
  .section-subtitle {
    text-align: center;
    font-size: 0.9em;
    letter-spacing: 0.2em;
    color: #5a4b41;
    margin: 40px 0 80px 0;
  }

  /* 图文左右排版列表 */
  .post-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 100px;
    gap: 60px; 
  }

  /* 左侧文字区 */
  .post-text {
    flex: 1; 
  }
  .post-meta {
    font-size: 0.8em;
    color: #888;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    display: block;
  }
  .post-text h2 {
    font-size: 2.2em;
    font-weight: normal;
    margin-top: 0;
    margin-bottom: 20px;
    color: #3b312b;
  }
  .post-text p {
    color: #5a4b41;
    font-size: 1.05em;
    margin-bottom: 30px;
  }
  .read-more {
    font-size: 0.8em;
    letter-spacing: 0.1em;
    border-bottom: 1px solid #5a4b41;
    padding-bottom: 3px;
  }
  .read-more:hover { color: #8b3a3a; border-color: #8b3a3a; }

  /* 右侧配图区 */
  .post-image {
    width: 55%; 
    aspect-ratio: 16 / 10; 
    object-fit: cover;
  }
</style>

<div class="hero-section"></div>

<div class="section-subtitle">文章列表</div>

<div class="post-list">
  {% for post in site.posts %}
    <div class="post-item">
      <div class="post-text">
        <span class="post-meta">{{ post.date | date: "%Y年%m月%d日" }}</span>
        <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
        <p>{{ post.content | strip_html | truncate: 100 }}</p>
        <a class="read-more" href="{{ post.url | relative_url }}">阅读全文</a>
      </div>
      {% if post.image %}
        <img class="post-image" src="{{ post.image }}" alt="{{ post.title }}">
      {% else %}
        <img class="post-image" src="https://images.unsplash.com/photo-1510127034890-ba27508e9f1c?auto=format&fit=crop&w=1200&q=80" alt="默认配图">
      {% endif %}
    </div>
  {% endfor %}
</div>
