<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <style>
    /* 全局与字体 (护眼底色与精装书衬线体) */
    body {
      background-color: #E3DFD8; 
      color: #2c2c2c;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; 
      line-height: 1.8; 
      letter-spacing: 0.05em;
      margin: 0; 
      padding: 0;
      overflow-x: hidden;
    }
    a { color: #5a4b41; text-decoration: none; transition: all 0.3s ease; }
    
    /* 顶部导航栏 (悬浮在首图上方) */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 30px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    header a.site-title { 
      color: #ffffff; 
      font-size: 1.3em; 
      font-weight: bold; 
      letter-spacing: 0.15em;
    }
    nav a { 
      color: #ffffff; 
      margin-left: 40px; 
      font-size: 1.05em; 
      letter-spacing: 0.1em;
    }
    nav a:hover { opacity: 0.6; }

    /* 非首页的导航栏样式 */
    body.not-home header { position: relative; background-color: #E3DFD8; border-bottom: 1px solid #d4cfc7;}
    body.not-home header a.site-title, body.not-home nav a { color: #2c2c2c; }
    body.not-home nav a:hover { color: #8b3a3a; }

    /* 主内容区限制宽度，使内容居中且优雅 */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px 80px 20px;
    }
    /* Markdown 文章内部排版补全 */
    main h1, main h2, main h3 { color: #1a1a1a; margin-top: 2em; font-weight: bold; border-bottom: 1px solid #d4cfc7; padding-bottom: 10px; }
    main blockquote { border-left: 3px solid #8b3a3a; background-color: #dcd7cf; color: #5c5c5c; padding: 15px 20px; margin: 30px 0; font-style: italic; }
  </style>
  main img { display: block; margin: 40px auto; max-width: 100%; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
</head>
<body class="{% if page.url == '/' %}is-home{% else %}not-home{% endif %}">
  <header>
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/about.html' | relative_url }}">关于</a>
      <a href="{{ '/guestbook.html' | relative_url }}">留言板</a>
      <a href="{{ '/contact.html' | relative_url }}">联系方式</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
