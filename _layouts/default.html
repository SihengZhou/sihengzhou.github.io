<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <style>
    /* 全局与字体 (提取自你提供的图片背景色 #E3DFD8) */
    body {
      background-color: #E3DFD8; 
      color: #2c2c2c;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; /* 保持精装书质感的衬线体 */
      line-height: 1.8; 
      letter-spacing: 0.05em;
      margin: 0; 
      padding: 0;
      overflow-x: hidden; /* 防止全宽图片导致横向滚动条 */
    }
    a { color: #5a4b41; text-decoration: none; transition: all 0.3s ease; }
    
    /* 顶部导航栏 (悬浮在首图上方) */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 30px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    header a.site-title { 
      color: #ffffff; /* 白色字体在图片上最醒目 */
      font-size: 1.2em; 
      font-weight: bold; 
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: sans-serif; /* Logo使用无衬线体更现代 */
    }
    nav a { 
      color: #ffffff; 
      margin-left: 40px; 
      font-size: 0.85em; 
      font-family: sans-serif; 
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    nav a:hover { opacity: 0.6; }

    /* 非首页的导航栏样式 (防止在纯色背景上看不见白字) */
    body.not-home header { position: relative; background-color: #E3DFD8; border-bottom: 1px solid #d4cfc7;}
    body.not-home header a.site-title, body.not-home nav a { color: #2c2c2c; }
    body.not-home nav a:hover { color: #8b3a3a; }

    /* 主内容区限制宽度，使内容居中且优雅 */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px 80px 20px;
    }
  </style>
</head>
<body class="{% if page.url == '/' %}is-home{% else %}not-home{% endif %}">
  <header>
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/about.html' | relative_url }}">关于</a>
      <a href="{{ '/guestbook.html' | relative_url }}">留言板</a>
      <a href="{{ '/contact.html' | relative_url }}">联系方式</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
